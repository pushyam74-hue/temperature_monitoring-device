<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#2b3a55; stroke-width:2; }
    .mcu { fill:#eef2fb; stroke:#2b3a55; stroke-width:2; }
    .label { font-size:15px; fill:#1b1f27; }
    .small { font-size:12px; fill:#4a5468; }
    .arrow { stroke:#2b3a55; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b3a55"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="760" height="360" rx="14" class="box" stroke="#8fa0c4"/>
  <text x="30" y="34" class="label" font-weight="bold">Hardware Topology</text>

  <!-- Temp sensor -->
  <rect x="470" y="50" width="110" height="55" rx="8" class="box"/>
  <text x="525" y="83" text-anchor="middle" class="label">Temp Sensor</text>

  <!-- MCU -->
  <rect x="450" y="160" width="150" height="120" rx="8" class="mcu"/>
  <text x="525" y="215" text-anchor="middle" class="label" font-weight="bold">uC</text>
  <text x="525" y="235" text-anchor="middle" class="small">(bare-metal app)</text>

  <!-- ADC arrow sensor -> MCU -->
  <line x1="525" y1="105" x2="525" y2="158" class="arrow"/>
  <text x="535" y="135" class="small">ADC</text>

  <!-- EEPROM -->
  <rect x="450" y="320" width="150" height="50" rx="8" class="box"/>
  <text x="525" y="350" text-anchor="middle" class="label">EEPROM</text>
  <line x1="525" y1="318" x2="525" y2="282" class="arrow" transform="rotate(180 525 300)"/>
  <line x1="525" y1="280" x2="525" y2="318" class="arrow"/>
  <text x="535" y="303" class="small">I2C</text>

  <!-- LED group -->
  <rect x="60" y="60" width="150" height="230" rx="10" class="box"/>
  <text x="135" y="85" text-anchor="middle" class="label" font-weight="bold">LEDs</text>
  <circle cx="135" cy="130" r="22" fill="#e08a8a" stroke="#7a2e2e" stroke-width="2"/>
  <text x="135" y="136" text-anchor="middle" class="label">R</text>
  <circle cx="135" cy="195" r="22" fill="#eed27a" stroke="#8a6f1f" stroke-width="2"/>
  <text x="135" y="201" text-anchor="middle" class="label">Y</text>
  <circle cx="135" cy="260" r="22" fill="#8fcf8f" stroke="#2f6a2f" stroke-width="2"/>
  <text x="135" y="266" text-anchor="middle" class="label">G</text>

  <!-- GPIO arrows MCU -> LEDs -->
  <line x1="448" y1="200" x2="212" y2="130" class="arrow"/>
  <line x1="448" y1="220" x2="212" y2="195" class="arrow"/>
  <line x1="448" y1="240" x2="212" y2="260" class="arrow"/>
  <text x="300" y="185" class="small">GPIOs</text>

</svg>
